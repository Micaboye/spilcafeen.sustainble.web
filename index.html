<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Ida Marie, Bex, Marie Luise & Sofie" />
    <meta
      name="description"
      content="Find et brætspil til dit besøg hos Spilcaféen og filtrér efter antal spillere, varighed og kategori."
    />

    <link rel="stylesheet" href="app.css" />
    <link rel="icon" href="img/favicon.ico" />

    <title>Spilcaféen - Spiloversigt</title>
  </head>

  <body>
    <header>
      <p class="site-name">Spilcaféen</p>
    </header>

    <main>
      <div class="intro-section">
        <h1>Spiloversigt</h1>

        <p class="intro-text">
          Find det rette spil til jeres besøg hos Spilcaféen. Søg blandt
          spillene eller filtrér efter antal spillere, varighed og kategori.
        </p>
      </div>

      <!-- Search Bar -->
      <div class="searchbar-container">
        <label for="search-input">Søg efter spil</label>
        <input id="search-input" type="search" placeholder="Søg spil..." />
      </div>

      <!-- Filter Bar -->
      <section class="filterbar">
        <div class="filter-group">
          <label for="players-select">Antal spillere</label>
          <select id="players-select"></select>
        </div>

        <div class="filter-group">
          <label for="genre-select2">Varighed</label>
          <select id="genre-select2"></select>
        </div>

        <div class="filter-group">
          <label for="genre-select1">Kategori</label>
          <select id="genre-select1"></select>
        </div>

        <button id="clear-filters" class="clear-btn">
          <span class="btn-icon"></span>
          <span class="btn-text">Ryd filtre</span>
        </button>
      </section>

      <!-- Feedback på antal spil -->
      <p id="results-status" aria-live="polite"></p>

      <!-- Game List -->
      <section id="game-list">
        <!-- Game cards will be rendered here by JavaScript -->
      </section>
    </main>

    <dialog id="game-dialog">
      <div id="dialog-content"></div>

      <button
        id="close-dialog"
        type="button"
        onclick="document.getElementById('game-dialog').close()"
      >
        Luk
      </button>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
